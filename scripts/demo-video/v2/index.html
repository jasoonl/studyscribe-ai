<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StudyScribe demo</title>
<style>
  /* Every piece of text uses the bundled Geist and Geist Mono (latin subsets), so a render looks the same on any machine. */
  @font-face { font-family: Geist; src: url(./assets/geist.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url(./assets/geist-mono.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #050b1f; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Geist, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .abs, .dcard, .ftile, .qcard, .step, .scene, .screen, .cap, .typed, .chip, .lower, .rim, .cur, .ripple, .ring, .big, .w, .fc, .face, .pill, .card, .think, .cta, .url, .edge, .who { position: absolute; left: 0; top: 0; }
  .scene { width: 1920px; height: 1080px; perspective: 2200px; }
  #bgDark { width: 1920px; height: 1080px; background: #071a4a; }
  #bgLight { width: 1920px; height: 1080px; background: #eef3fc; }
  .big { width: 1640px; font-size: 108px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.08; text-align: center; color: #fff; }
  .w { position: relative; display: inline-block; white-space: pre; }
  .gone { color: #7db4ff; }
  .ring { width: 360px; height: 360px; border-radius: 50%; border: 2px solid rgba(125, 180, 255, .45); }
  .mark { font-size: 156px; font-weight: 700; letter-spacing: -0.045em; text-align: center; width: 1920px; color: #fff; }
  .tag { font-size: 54px; font-weight: 500; text-align: center; width: 1920px; color: #a9c4ff; letter-spacing: -0.01em; }
  .screen { width: 1600px; height: 896px; transform-origin: 0 0; border-radius: 30px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(40, 70, 160, .12), 0 2px 6px rgba(25, 55, 150, .08), 0 50px 110px -20px rgba(25, 55, 150, .34); }
  .screen.free { transform-origin: 50% 50%; }
  .screen img { display: block; width: 1600px; height: 896px; }
  .typed { white-space: nowrap; box-sizing: border-box; }
  .cap { text-align: center; }
  .cap span { display: inline-block; padding: 12px 30px; border-radius: 22px; background: #0b1f55; color: #fff; font-size: 38px; font-weight: 600; letter-spacing: -0.015em; }
  /* Highlight boxes sit on a screenshot, so their sizes are multiplied by --k (1 / the screenshot's scale) to look the same at any zoom. */
  .rim { --k: 1; box-sizing: border-box; border: calc(3px * var(--k)) solid #2f6bff; background: rgba(47, 107, 255, .06); box-shadow: 0 0 0 calc(5px * var(--k)) rgba(47, 107, 255, .16); }
  .rim.soft { border: 0; background: rgba(47, 107, 255, .09); box-shadow: 0 0 0 calc(2px * var(--k)) rgba(47, 107, 255, .32); }
  .cur svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .ripple { box-sizing: border-box; border-radius: 50%; border: 3px solid #2f6bff; }
  .edge { height: 30px; background: linear-gradient(rgba(20, 45, 130, .16), rgba(20, 45, 130, 0)); border-top: 1px solid rgba(40, 70, 160, .14); box-sizing: border-box; }
  .chip { display: flex; align-items: center; gap: 12px; padding: 15px 26px; border-radius: 999px; background: #fff; color: #0b1f55; font-weight: 600; font-size: 31px; letter-spacing: -0.015em; white-space: nowrap; box-shadow: 0 10px 28px rgba(11, 31, 85, .14), 0 0 0 1px rgba(11, 31, 85, .08); }
  .chip i { width: 14px; height: 14px; border-radius: 50%; background: #2f6bff; }
  .chip.ok i { background: #16a34a; }
  .fc { width: 640px; height: 400px; transform-style: preserve-3d; }
  .face { width: 640px; height: 400px; box-sizing: border-box; padding: 40px 46px; border-radius: 34px; background: #fff; backface-visibility: hidden; box-shadow: 0 24px 60px rgba(11, 31, 85, .16), 0 0 0 1px rgba(11, 31, 85, .08); display: flex; flex-direction: column; justify-content: center; }
  .face small { font-size: 22px; letter-spacing: .16em; font-weight: 700; color: #2f6bff; }
  .face p { margin: 18px 0 0; font-size: 44px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; color: #0b1f55; }
  .face.back { transform: rotateY(180deg); background: #2f6bff; }
  .face.back small { color: #b9d4ff; }
  .face.back p { color: #fff; font-size: 76px; }
  .pill { height: 78px; padding: 0 38px; border-radius: 999px; display: flex; align-items: center; font-size: 32px; font-weight: 600; white-space: nowrap; }
  .pill.off { background: rgba(255, 255, 255, .75); color: #6b7a99; box-shadow: 0 0 0 1.5px rgba(59, 110, 240, .2); }
  .pill.on { background: #2f6bff; color: #fff; }
  .pill.dark.off { background: rgba(255, 255, 255, .08); color: #8aa4d8; box-shadow: 0 0 0 1.5px rgba(138, 164, 216, .35); }
  .card { width: 560px; height: 200px; border-radius: 34px; background: #fff; display: flex; align-items: center; justify-content: center; box-sizing: border-box; font-size: 42px; font-weight: 700; color: #0b1f55; letter-spacing: -0.02em; box-shadow: 0 20px 50px rgba(11, 31, 85, .14), 0 0 0 1px rgba(11, 31, 85, .08); }
  .callouts { position: absolute; display: flex; gap: 24px; white-space: nowrap; }
  .callouts.column { flex-direction: column; align-items: flex-start; gap: 20px; }
  .callouts .chip { position: relative; left: auto; top: auto; }
  .wipe { position: absolute; left: -400px; top: -100px; width: 900px; height: 1300px; }
  .wipe i { position: absolute; inset: 0 250px; transform: skewX(-12deg); background: #2f6bff; }
  .cta { font-size: 46px; font-weight: 700; padding: 0 64px; height: 118px; border-radius: 999px; display: flex; align-items: center; background: #2f6bff; color: #fff; }
  .url { font-size: 42px; font-weight: 500; color: #a9c4ff; width: 1920px; text-align: center; letter-spacing: -0.01em; }
  .think { display: flex; align-items: center; gap: 16px; padding: 18px 30px; border-radius: 26px; background: #fff; color: #0b1f55; font-size: 30px; font-weight: 600; box-shadow: 0 10px 28px rgba(11, 31, 85, .14), 0 0 0 1px rgba(11, 31, 85, .08); }
  .lat { display: grid; grid-template-columns: repeat(3, 12px); gap: 5px; }
  .lat u { width: 12px; height: 12px; border-radius: 50%; background: #2f6bff; opacity: .15; }
  .dcard { border-radius: 30px; background: #0e2a6e; box-shadow: 0 30px 80px rgba(2, 8, 30, .45); box-sizing: border-box; padding: 30px 34px; }
  .dcard small { display: block; font-size: 22px; letter-spacing: .16em; font-weight: 700; color: #8ec1ff; margin-bottom: 18px; }
  .dline { font-size: 26px; line-height: 1.35; color: #e8f0ff; margin: 0 0 14px; white-space: nowrap; overflow: hidden; }
  .dline b { color: #7db4ff; font-family: "Geist Mono", monospace; font-size: 22px; margin-right: 14px; font-weight: 500; }
  .ftile { width: 400px; height: 112px; border-radius: 26px; display: flex; align-items: center; padding: 0 34px; box-sizing: border-box; font-size: 36px; font-weight: 700; letter-spacing: -0.02em; color: #fff; background: #2f6bff; }
  .qcard { width: 1160px; border-radius: 36px; background: #fff; padding: 44px 52px 52px; box-sizing: border-box; box-shadow: 0 30px 70px rgba(11, 31, 85, .14), 0 0 0 1px rgba(11, 31, 85, .08); color: #0b1f55; }
  .qcard small { font-size: 22px; letter-spacing: .14em; font-weight: 700; color: #2f6bff; }
  .qcard h3 { margin: 12px 0 28px; font-size: 44px; line-height: 1.15; letter-spacing: -0.025em; font-weight: 700; }
  .opt { position: relative; display: flex; align-items: center; gap: 22px; height: 84px; margin-bottom: 16px; padding: 0 28px; border-radius: 20px; box-sizing: border-box; font-size: 31px; font-weight: 500; background: #f3f7ff; box-shadow: inset 0 0 0 2px #dbe6ff; }
  .opt u { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 3px #b4c8f5; flex: none; }
  .opt.right { background: #e8fbef; box-shadow: inset 0 0 0 3px #22a55a; }
  .opt.right u { background: #22a55a; box-shadow: none; }
  .who { left: 0; width: 1920px; text-align: center; font-size: 76px; font-weight: 700; letter-spacing: -0.035em; color: #0b1f55; }
  .step { width: 460px; text-align: center; color: #0b1f55; }
  .step em { display: grid; place-items: center; margin: 0 auto 28px; width: 128px; height: 128px; border-radius: 50%; font-style: normal; font-size: 62px; font-weight: 700; color: #fff; background: #2f6bff; }
  .step b { display: block; font-size: 48px; letter-spacing: -0.03em; }
  .step span { display: block; margin-top: 10px; font-size: 28px; color: #4a5878; }
  .ghost { position: absolute; box-sizing: border-box; border: 2px dashed rgba(142, 193, 255, .45); }
  .dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; margin: -9px 0 0 -9px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="rects.js"></script>
<script src="scenes.js"></script>
</body>
</html>
